<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | CareerTrellis</title>
    <link rel="stylesheet" href="/static/maintenance-notice.css?v=1">
    <script src="/static/maintenance-notice.js?v=1" defer></script>
</head>
<body class="sign-in-page">
    <div class="notice-announcer" id="maintenance-announcer" role="status" aria-live="polite" aria-atomic="true"></div>
    <main class="sign-in-card">
        <h1>CareerTrellis</h1>
        <p>Sign in to your job-search workspace.</p>
        <section class="maintenance-notice" id="maintenance-notice" aria-label="Maintenance announcement" hidden></section>
        <noscript><p>Enable JavaScript to see current maintenance announcements.</p></noscript>
        <a class="sign-in-button" href="/auth/login">Continue to sign in</a>
        <p class="sign-in-note">Access is limited to invited users.</p>
    </main>
</body>
</html>
