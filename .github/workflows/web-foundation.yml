name: Web foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-runtime:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install reviewed lock
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements.txt
      - name: Install locked Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Verify packages
        run: python -m pip check
      - name: Run regressions
        run: python -m unittest test_p0_regressions.py test_search_runs.py test_object_store.py test_object_import.py test_stored_objects.py test_analytics.py test_observability.py
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Exercise staging worker entrypoint
        env:
          CAREERTRELLIS_ENVIRONMENT: staging
          CAREERTRELLIS_ALLOWED_HOSTS: staging-app.jhunterj.com
          CAREERTRELLIS_TRUSTED_PROXY_TOKEN: ci-only-origin-token-00000000000000000000000000000000
          CAREERTRELLIS_DATA_DIR: ${{ runner.temp }}/careertrellis-worker
        run: python worker.py --once
      - name: Check deployment shell syntax
        working-directory: ${{ github.workspace }}
        run: bash -n deploy/scripts/*.sh

  postgres-rls:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-postgres-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install reviewed lock
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements.txt
      - name: Verify PostgreSQL migrations and tenant isolation
        env:
          CAREERTRELLIS_POSTGRES_TEST_ADMIN_URL: postgresql+psycopg://postgres:ci-postgres-admin@127.0.0.1:5432/postgres
        run: python -m unittest -v test_postgres_rls.py
