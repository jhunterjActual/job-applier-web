name: Web foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-runtime:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install reviewed lock
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements.txt
      - name: Install locked Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Verify packages
        run: python -m pip check
      - name: Run evaluation budget controls
        working-directory: ${{ github.workspace }}/scripts/value_evaluation
        run: python -B -m unittest -v test_budget_guard test_ct_budget_transport test_campaign_state test_study_upstream
      - name: Run regressions
        run: python -m unittest test_p0_regressions.py test_feedback.py test_feedback_browser.py test_caddy_feedback_ops.py test_account_choice.py test_backup_health.py test_pilot_acceptance.py test_pilot_acceptance_receipts.py test_search_runs.py test_scheduled_search_dispatch.py test_role_queries.py test_title_compatibility_audit.py test_managed_search_reporting.py test_discovery_sources.py test_account_erasure.py test_object_store.py test_object_import.py test_import_reconciliation.py test_stored_objects.py test_generated_materials.py test_dependent_job_deletion.py test_dependent_bulk_cleanup.py test_postgres_cutover_routes.py test_cutover_rehearsal.py test_final_cutover_coordinator.py test_generated_object_recovery.py test_generated_object_capture.py test_generated_object_phases.py test_analytics.py test_observability.py
      - name: Run search review regressions
        run: python -m unittest test_search_review.py test_role_plan_browser.py test_coverage_diagnostics.py test_search_completion_browser.py
      - name: Run final PDF byte diagnostics
        working-directory: ${{ github.workspace }}
        run: python -B -m unittest discover -s scripts -p test_document_quality.py
      - name: Verify native comparison cost arithmetic
        working-directory: ${{ github.workspace }}/scripts/value_evaluation
        run: python -B -m unittest -v test_native_cost_envelope
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Verify identity-withheld packet preparation
        working-directory: ${{ github.workspace }}/scripts/value_evaluation
        run: python -B -m unittest -v test_blind_packets
      - name: Run evaluation evidence checks
        working-directory: ${{ github.workspace }}
        run: python -B -m unittest discover -s scripts -p test_value_evidence.py
      - name: Run study freeze readiness checks
        working-directory: ${{ github.workspace }}
        run: python -B -m unittest discover -s scripts -p test_study_readiness.py
      - name: Exercise staging worker entrypoint
        env:
          CAREERTRELLIS_ENVIRONMENT: staging
          CAREERTRELLIS_DATA_DIR: ${{ runner.temp }}/careertrellis-worker
        run: python worker.py --once
      - name: Exercise disabled account-erasure worker entrypoint
        env:
          CAREERTRELLIS_ENVIRONMENT: staging
          CAREERTRELLIS_DATA_DIR: ${{ runner.temp }}/careertrellis-account-erasure
          CAREERTRELLIS_ACCOUNT_ERASURE_WORKER_ENABLED: "false"
        run: python account_erasure_worker.py --once
      - name: Check deployment shell syntax
        working-directory: ${{ github.workspace }}
        run: bash -n deploy/scripts/*.sh

  postgres-rls:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-postgres-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install reviewed lock
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements.txt
      - name: Verify PostgreSQL migrations and tenant isolation
        env:
          CAREERTRELLIS_POSTGRES_TEST_ADMIN_URL: postgresql+psycopg://postgres:ci-postgres-admin@127.0.0.1:5432/postgres
        run: python -m unittest -v test_postgres_rls.py test_disabled_search_cleanup.py test_postgres_scheduled_search_dispatch.py test_account_erasure.py test_import_reconciliation.py test_generated_materials.py test_dependent_job_deletion.py test_dependent_bulk_cleanup.py test_postgres_cutover_routes.py test_cutover_rehearsal.py test_final_cutover_coordinator.py
